apiVersion: v1
kind: ConfigMap
metadata:
  name: xonotic-grafana-logs-dashboard
  namespace: xonotic-observability
data:
  xonotic-platform-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"xonotic-allocator-backend\", app=\"xonotic-allocator-backend\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Allocator Backend Logs",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"xonotic-allocator-backend\", app=\"xonotic-allocator-backend\"} |~ \"(?i)(allocation.*(fail|error)|no.ready.*server|no_ready_servers)\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Allocation Failures",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"xonotic-allocator-backend\", app=\"xonotic-allocator-backend\"} |~ \"(?i)((rcon|getstatus).*(fail|error|timeout)|(fail|error|timeout).*(rcon|getstatus))\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "RCON / getstatus Errors",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "id": 4,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"xonotic-agones\", container=\"server\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Agones / Xonotic GameServer Logs",
          "type": "logs"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "xonotic",
        "loki",
        "logs"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Xonotic Platform Logs",
      "uid": "xonotic-platform-logs",
      "version": 1,
      "weekStart": ""
    }
