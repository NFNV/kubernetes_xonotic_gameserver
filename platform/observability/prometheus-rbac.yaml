apiVersion: v1
kind: ServiceAccount
metadata:
  name: xonotic-prometheus
  namespace: xonotic-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xonotic-prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - endpoints
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - nonResourceURLs:
      - /metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xonotic-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xonotic-prometheus
subjects:
  - kind: ServiceAccount
    name: xonotic-prometheus
    namespace: xonotic-observability
