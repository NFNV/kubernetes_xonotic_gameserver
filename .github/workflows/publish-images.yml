name: Publish Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full Git SHA to publish; defaults to the selected workflow ref
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: Resolve release revision
        id: revision
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_RUN_SHA:-${REQUESTED_SHA:-${GITHUB_SHA}}}"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a full 40-character Git SHA: ${sha}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Read platform version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a semantic version without a leading v: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

  release:
    name: Publish ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: allocator backend
            context: allocator-backend
            image: xonotic-allocator-backend
            description: Xonotic allocator control-plane backend
            include_build_metadata: true
          - name: allocator frontend
            context: allocator-frontend
            image: xonotic-allocator-frontend
            description: Xonotic allocator admin and player frontend
            include_build_metadata: true
          - name: Xonotic GameServer
            context: server
            image: xonotic-server
            description: Agones-managed Xonotic dedicated GameServer
            include_build_metadata: false
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Derive image metadata
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DESCRIPTION: ${{ matrix.description }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable and release tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          semantic_tag="${IMAGE}:v${VERSION}"
          semantic_published=true
          inspect_output=""
          if inspect_output="$(docker buildx imagetools inspect "${semantic_tag}" 2>&1)"; then
            echo "Semantic tag ${semantic_tag} already exists; preserving it." >&2
            semantic_published=false
          elif ! grep -Eqi 'manifest unknown|not found' <<<"${inspect_output}"; then
            echo "Could not safely determine whether ${semantic_tag} exists; refusing to risk overwriting it." >&2
            printf '%s\n' "${inspect_output}" >&2
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${RELEASE_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
              echo "${IMAGE}:master"
            fi
            if [[ "${semantic_published}" == "true" ]]; then
              echo "${semantic_tag}"
            fi
            echo "EOF"
            echo "semantic_published=${semantic_published}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare coordinated build arguments
        id: build_metadata
        env:
          INCLUDE_BUILD_METADATA: ${{ matrix.include_build_metadata }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TIME: ${{ needs.prepare.outputs.created }}
        run: |
          set -euo pipefail
          {
            echo "build_args<<EOF"
            if [[ "${INCLUDE_BUILD_METADATA}" == "true" ]]; then
              echo "APP_VERSION=${VERSION}"
              echo "GIT_SHA=${RELEASE_SHA}"
              echo "BUILD_TIME=${BUILD_TIME}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build_metadata.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summarize release
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SEMANTIC_PUBLISHED: ${{ steps.tags.outputs.semantic_published }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "- Platform version: \`v${VERSION}\`"
            echo "- Git SHA: \`${RELEASE_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            if [[ "${SEMANTIC_PUBLISHED}" != "true" ]]; then
              echo "- Semantic tag: preserved existing \`v${VERSION}\` (not overwritten)"
            fi
            echo "- Tags:"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "  - \`${tag}\`"
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
