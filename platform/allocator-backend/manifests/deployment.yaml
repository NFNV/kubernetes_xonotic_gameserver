apiVersion: apps/v1
kind: Deployment
metadata:
  name: xonotic-allocator-backend
  namespace: xonotic-allocator-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xonotic-allocator-backend
  template:
    metadata:
      labels:
        app: xonotic-allocator-backend
    spec:
      serviceAccountName: xonotic-allocator-backend
      containers:
        - name: backend
          image: ghcr.io/nfnv/xonotic-allocator-backend:allocator-backend
          imagePullPolicy: Always
          env:
            - name: AGONES_NAMESPACE
              value: xonotic-agones
            - name: FLEET_NAME
              value: xonotic-fleet
            - name: GAME_LABEL
              value: xonotic
            - name: XONOTIC_MULTICLUSTER_KUBECONFIG
              value: /var/run/xonotic/kubeconfig/config
            - name: XONOTIC_SOUTH_AMERICA_KUBE_CONTEXT
              valueFrom:
                secretKeyRef:
                  name: xonotic-multicluster-kubeconfig
                  key: XONOTIC_SOUTH_AMERICA_KUBE_CONTEXT
            - name: XONOTIC_EUROPE_KUBE_CONTEXT
              valueFrom:
                secretKeyRef:
                  name: xonotic-multicluster-kubeconfig
                  key: XONOTIC_EUROPE_KUBE_CONTEXT
            - name: XONOTIC_NORTH_AMERICA_KUBE_CONTEXT
              valueFrom:
                secretKeyRef:
                  name: xonotic-multicluster-kubeconfig
                  key: XONOTIC_NORTH_AMERICA_KUBE_CONTEXT
            - name: XONOTIC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xonotic-rcon
                  key: XONOTIC_RCON_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xonotic-admin-auth
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: xonotic-admin-auth
                  key: ADMIN_PASSWORD_HASH
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: xonotic-admin-auth
                  key: ADMIN_SESSION_SECRET
            - name: POSTGRES_HOST
              value: xonotic-postgres.xonotic-allocator-backend.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: multicluster-kubeconfig
              mountPath: /var/run/xonotic/kubeconfig
              readOnly: true
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: multicluster-kubeconfig
          secret:
            secretName: xonotic-multicluster-kubeconfig
            defaultMode: 0400
