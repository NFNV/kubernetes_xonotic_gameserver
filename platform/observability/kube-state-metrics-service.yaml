apiVersion: v1
kind: Service
metadata:
  name: xonotic-kube-state-metrics
  namespace: xonotic-observability
spec:
  type: ClusterIP
  selector:
    app: xonotic-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: telemetry
      port: 8081
      targetPort: telemetry
      protocol: TCP
