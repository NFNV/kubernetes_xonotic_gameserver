apiVersion: v1
kind: ConfigMap
metadata:
  name: xonotic-grafana-datasources
  namespace: xonotic-observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://xonotic-prometheus.xonotic-observability.svc.cluster.local:9090
        isDefault: true
        editable: false
