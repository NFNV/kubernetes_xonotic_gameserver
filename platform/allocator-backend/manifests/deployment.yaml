apiVersion: apps/v1
kind: Deployment
metadata:
  name: xonotic-allocator-backend
  namespace: xonotic-allocator-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xonotic-allocator-backend
  template:
    metadata:
      labels:
        app: xonotic-allocator-backend
    spec:
      serviceAccountName: xonotic-allocator-backend
      containers:
        - name: backend
          image: ghcr.io/nfnv/xonotic-allocator-backend:allocator-backend
          imagePullPolicy: Always
          env:
            - name: AGONES_NAMESPACE
              value: xonotic-agones
            - name: FLEET_NAME
              value: xonotic-fleet
            - name: GAME_LABEL
              value: xonotic
            - name: XONOTIC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xonotic-rcon
                  key: XONOTIC_RCON_PASSWORD
            - name: POSTGRES_HOST
              value: xonotic-postgres.xonotic-allocator-backend.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xonotic-postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
