apiVersion: apps/v1
kind: Deployment
metadata:
  name: xonotic-kube-state-metrics
  namespace: xonotic-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xonotic-kube-state-metrics
  template:
    metadata:
      labels:
        app: xonotic-kube-state-metrics
    spec:
      serviceAccountName: xonotic-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args:
            - --custom-resource-state-config-file=/etc/kube-state-metrics/custom-resource-state.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: custom-resource-state
              mountPath: /etc/kube-state-metrics
              readOnly: true
      volumes:
        - name: custom-resource-state
          configMap:
            name: xonotic-kube-state-metrics-custom-resources
