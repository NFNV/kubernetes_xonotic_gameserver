apiVersion: v1
kind: ServiceAccount
metadata:
  name: xonotic-alloy
  namespace: xonotic-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xonotic-alloy
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xonotic-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xonotic-alloy
subjects:
  - kind: ServiceAccount
    name: xonotic-alloy
    namespace: xonotic-observability
